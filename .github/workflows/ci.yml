name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Test (pytest)
        run: pytest -q

      # Ловит то, что не ловят unit-тесты: сервер должен реально подняться
      # и ответить на MCP-хендшейк. Без этого шага мажорный апгрейд SDK
      # проходит CI незамеченным, а опубликованный пакет падает при импорте.
      - name: Startup smoke (MCP handshake, без сети)
        env:
          CHECKO_API_KEY: ci-dummy-key
        run: python scripts/smoke.py --no-api

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t checko-mcp:ci .
